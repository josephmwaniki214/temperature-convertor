<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperature Convertor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1 class="heading">Temperature Converter</h1>
    <div class ="temp-container">
      <label for="celsius">Celsius:</label>
      <input type="number" id="celsius" class="input" name="celsius" onchange="computeTemp(event)" placeholder="Enter temperature">
    </div>
    <div class="temp-container">
      <label for="fahrenheit">Fahrenheit:</label>
      <input type="number" id="fahrenheit" class="input" name="fahrenheit" onchange="computeTemp(event)" placeholder="Enter temperature">
    </div>
    <div class="temp-container">
      <label for="kelvin">Kelvin:</label>
      <input type="number" class="input" id="kelvin" name="kelvin" onchange="computeTemp(event)" placeholder="Enter temperature">
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
